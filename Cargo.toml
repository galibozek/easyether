[package]
name = "easyether"
version = "0.6.2"
edition = "2024"
description = "Peer-to-peer Ethernet (L2) sharing over LAN, using SoftEther SeLow/Neo drivers on Windows"
license = "GPL-3.0-or-later"

[dependencies]
# GUI: egui with the OpenGL (glow) renderer – small and portable, no wgpu/DirectX stack.
# Linux is Wayland-only; no accesskit (its winit integration would pull the X11 backend back in).
eframe = { version = "0.37", default-features = false, features = [
    "clipboard", "default_fonts", "glow", "wayland",
] }
# Networking and security
socket2 = { version = "0.6", features = ["all"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
spake2 = "0.4"
# SHA-256, HMAC and the OS RNG; already compiled for rustls
ring = "0.17"
# Settings and logging
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(not(target_os = "linux"))'.dependencies]
# Tray on Windows/macOS, maintained by the Tauri team (no tray on Linux, see gui/tray.rs).
# Default features only add the Linux GTK backend, which would still sit in Cargo.lock.
tray-icon = { version = "0.26", default-features = false }

[target.'cfg(windows)'.dependencies]
# Official Microsoft bindings
windows-registry = "0.100"
raw-window-handle = "0.6"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Threading",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_System_Console",
    "Win32_Globalization",
] }

[build-dependencies]
winresource = "0.1"
# Renders assets/logo.svg at build time (bitmaps embedded by src/logo.rs, .ico on Windows).
resvg = { version = "0.49", default-features = false }

[profile.release]
lto = true
strip = true
